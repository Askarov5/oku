[project]
name = "oku-ai-worker"
version = "0.1.0"
description = "Phase 1 PDF ingestion worker for oku"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "psycopg[binary,pool]>=3.2.3",
  "boto3>=1.35.76",
  "pymupdf>=1.25.1",
  "pillow>=11.0.0",
  "pydantic>=2.10.3",
  "pydantic-settings>=2.7.0",
  "litellm>=1.55.8",
  "httpx>=0.28.1",
  "python-multipart>=0.0.20",
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["setuptools>=75.6.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
